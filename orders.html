<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Pinki Latest Fashion</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <header class="bg-white shadow px-6 py-4 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="text-pink-600 hover:text-pink-700 font-bold text-xl">
                <i class="fa-solid fa-arrow-left mr-2"></i>होम पेज
            </a>
            <h1 class="text-xl font-bold text-gray-800 border-l-2 pl-3">मेरे ऑर्डर्स (My Orders)</h1>
        </div>
        <div id="user-info" class="text-sm font-semibold text-gray-600"></div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-6">
        <div id="loading" class="text-center py-10 font-medium text-gray-500">
            <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-pink-600 block"></i> ऑर्डर्स लोड हो रहे हैं...
        </div>

        <div id="no-orders" class="hidden text-center py-16 bg-white rounded-xl shadow-sm border border-gray-100">
            <i class="fa-solid fa-box-open text-5xl text-gray-300 mb-3"></i>
            <p class="text-lg font-semibold text-gray-600">आपका कोई पिछला ऑर्डर नहीं मिला।</p>
            <a href="index.html" class="inline-block mt-4 px-6 py-2 bg-pink-600 text-white rounded-lg hover:bg-pink-700 transition">शॉपिंग करें</a>
        </div>

        <div id="orders-list" class="space-y-4"></div>
    </main>

    <!-- रिटर्न रिक्वेस्ट पॉपअप (Return Modal with Photo Upload) -->
    <div id="return-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-rotate-left text-amber-500 mr-2"></i>प्रोडक्ट रिटर्न करें</h3>
                <button onclick="closeReturnModal()" class="text-gray-400 hover:text-gray-700 text-xl">&times;</button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">रिटर्न करने का कारण *</label>
                    <textarea id="return-reason" rows="3" placeholder="जैसे: साइज छोटा है, प्रोडक्ट डैमेज है आदि..." class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-pink-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">प्रोडक्ट की फोटो अपलोड करें *</label>
                    <input type="file" id="return-photo" accept="image/*" onchange="previewReturnImage(event)" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-pink-50 file:text-pink-700 hover:file:bg-pink-100 cursor-pointer">
                    
                    <!-- फोटो प्रिव्यू -->
                    <div id="photo-preview-box" class="hidden mt-3 relative">
                        <img id="photo-preview" src="" alt="Preview" class="w-full h-40 object-contain rounded-lg border bg-gray-100">
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-2 border-t">
                <button onclick="closeReturnModal()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg text-sm font-semibold hover:bg-gray-300 transition">रद्द करें</button>
                <button id="submit-return-btn" onclick="submitReturnRequest()" class="px-5 py-2 bg-amber-500 text-white rounded-lg text-sm font-bold hover:bg-amber-600 shadow transition">
                    रिटर्न सबमिट करें
                </button>
            </div>
        </div>
    </div>

    <script>
        // यहाँ अपनी index.html वाली असली apiKey जरूर डालें
        const firebaseConfig = {
            apiKey: "YAHAN_APNI_ASLI_API_KEY_DALEIN",
            authDomain: "pinki-latest-fashion.firebaseapp.com",
            projectId: "pinki-latest-fashion",
            storageBucket: "pinki-latest-fashion.firebasestorage.app",
            messagingSenderId: "432889531515",
            appId: "1:432889531515:web:e0d4e5f9e04369051ae6de"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const loggedInRaw = sessionStorage.getItem("currentLoggedInUser");
        if (!loggedInRaw) {
            alert("ऑर्डर्स देखने के लिए पहले लॉग-इन करें।");
            window.location.href = "account.html";
        }
        
        const currentUser = loggedInRaw ? JSON.parse(loggedInRaw) : {};
        document.getElementById("user-info").innerText = currentUser.name ? `नमस्ते, ${currentUser.name}` : "";

        let selectedReturnDocId = null;
        let compressedBase64Image = "";

        async function loadUserOrders() {
            const ordersList = document.getElementById("orders-list");
            const loading = document.getElementById("loading");
            const noOrders = document.getElementById("no-orders");

            if (!currentUser.email) {
                loading.classList.add("hidden");
                noOrders.classList.remove("hidden");
                return;
            }

            const loggedEmail = currentUser.email.trim().toLowerCase();

            try {
                const snapshot = await db.collection("orders").get();
                loading.classList.add("hidden");

                const matchedOrders = [];

                snapshot.forEach(doc => {
                    const order = doc.data();
                    const dbEmail = (order.email || order.userEmail || "").trim().toLowerCase();
                    
                    if (dbEmail === loggedEmail) {
                        matchedOrders.push({ id: doc.id, ...order });
                    }
                });

                if (matchedOrders.length === 0) {
                    noOrders.classList.remove("hidden");
                    ordersList.innerHTML = "";
                    return;
                }

                noOrders.classList.add("hidden");
                ordersList.innerHTML = "";

                matchedOrders.forEach(order => {
                    const docId = order.id;
                    const isCancelled = order.deliveryStatus === "कैंसिल किया गया";
                    const isReturned = order.deliveryStatus === "रिटर्न रिक्वेस्ट दर्ज";

                    const card = document.createElement("div");
                    card.className = "bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row justify-between gap-4";

                    card.innerHTML = `
                        <div class="space-y-1">
                            <div class="flex items-center space-x-2">
                                <span class="text-xs bg-pink-100 text-pink-700 font-bold px-2 py-0.5 rounded">ID: ${order.orderId || docId}</span>
                                <span class="text-xs text-gray-500">${order.orderDate || ""}</span>
                            </div>
                            <h2 class="text-lg font-bold text-gray-800">${order.productName || "प्रोडक्ट"}</h2>
                            <p class="text-sm text-gray-600">साइज: <span class="font-medium">${order.size || "Free Size"}</span> | मात्रा: <span class="font-medium">${order.quantity || 1}</span></p>
                            <p class="text-sm text-gray-600">कुल राशि: <span class="font-bold text-pink-600">₹${order.totalAmount}</span> (${order.paymentMethod || "COD"})</p>
                            <p class="text-sm">डिलीवरी स्टेटस: 
                                <span class="font-semibold ${isCancelled ? 'text-red-600' : isReturned ? 'text-amber-600' : 'text-blue-600'}">
                                    ${order.deliveryStatus || "प्रोसेस में"}
                                </span>
                            </p>
                        </div>

                        <div class="flex md:flex-col justify-end gap-2 shrink-0">
                            ${!isCancelled && !isReturned ? `
                                <!-- लाल रंग का कैंसिल बटन और काले रंग का टेक्स्ट -->
                                <button onclick="cancelOrder('${docId}')" class="px-4 py-2 bg-red-600 text-black font-bold rounded-lg text-sm hover:bg-red-700 shadow-sm transition">
                                    <i class="fa-solid fa-xmark mr-1"></i> कैंसिल करें
                                </button>
                                <!-- कलर्ड रिटर्न बटन -->
                                <button onclick="openReturnModal('${docId}')" class="px-4 py-2 bg-amber-500 text-white font-bold rounded-lg text-sm hover:bg-amber-600 shadow-sm transition">
                                    <i class="fa-solid fa-rotate-left mr-1"></i> रिटर्न करें
                                </button>
                            ` : `
                                <span class="text-sm font-bold px-3 py-1.5 rounded-lg ${isCancelled ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-800'} self-center">
                                    ${isCancelled ? "ऑर्डर कैंसिल हो चुका है" : "रिटर्न प्रक्रिया में है"}
                                </span>
                            `}
                        </div>
                    `;

                    ordersList.appendChild(card);
                });

            } catch (err) {
                loading.innerText = "ऑर्डर्स लोड करने में समस्या आई: " + err.message;
            }
        }

        async function cancelOrder(docId) {
            const reason = prompt("ऑर्डर कैंसिल करने का कारण दर्ज करें (वैकल्पिक):");
            if (reason === null) return;

            try {
                await db.collection("orders").doc(docId).update({
                    deliveryStatus: "कैंसिल किया गया",
                    cancelReason: reason || "ग्राहक द्वारा कैंसिल",
                    cancelledAt: new Date().toLocaleString("hi-IN")
                });
                alert("Your order has been successfully cancelled ");
                loadUserOrders();
            } catch (err) {
                alert("समस्या आई: " + err.message);
            }
        }

        // रिटर्न पॉपअप खोलना
        function openReturnModal(docId) {
            selectedReturnDocId = docId;
            compressedBase64Image = "";
            document.getElementById("return-reason").value = "";
            document.getElementById("return-photo").value = "";
            document.getElementById("photo-preview-box").classList.add("hidden");
            document.getElementById("return-modal").classList.remove("hidden");
        }

        // रिटर्न पॉपअप बंद करना
        function closeReturnModal() {
            document.getElementById("return-modal").classList.add("hidden");
            selectedReturnDocId = null;
        }

        // फोटो प्रिव्यू और ऑटो-कम्प्रेशन (ताकि Firestore में आसानी से सेव हो सके)
        function previewReturnImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement("canvas");
                    const MAX_WIDTH = 600; // साइज छोटा रखने के लिए
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;

                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    compressedBase64Image = canvas.toDataURL("image/jpeg", 0.7);
                    document.getElementById("photo-preview").src = compressedBase64Image;
                    document.getElementById("photo-preview-box").classList.remove("hidden");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // रिटर्न रिक्वेस्ट डेटाबेस में सेव करना
        async function submitReturnRequest() {
            const reason = document.getElementById("return-reason").value.trim();
            const submitBtn = document.getElementById("submit-return-btn");

            if (!reason) {
                alert("कृपया रिटर्न करने का कारण लिखें।");
                return;
            }
            if (!compressedBase64Image) {
                alert("कृपया प्रोडक्ट की एक फोटो अपलोड करें।");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "सबमिट हो रहा है...";

            try {
                await db.collection("orders").doc(selectedReturnDocId).update({
                    deliveryStatus: "रिटर्न रिक्वेस्ट दर्ज",
                    returnReason: reason,
                    returnImage: compressedBase64Image, // The uploaded photo will be saved here. 
                    returnedAt: new Date().toLocaleString("hi-IN")
                });
                
                alert("Your return request and photo have been successfully registered. ");
                closeReturnModal();
                loadUserOrders();
            } catch (err) {
                alert("problem occurred : " + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "return submit";
            }
        }

        loadUserOrders();
    </script>
</body>
</html>
