<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Pinki Latest Fashion</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

    <header class="bg-white shadow px-6 py-4 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="text-pink-600 hover:text-pink-700 font-bold text-xl">
                <i class="fa-solid fa-arrow-left mr-2"></i>Home Page
            </a>
            <h1 class="text-xl font-bold text-gray-800 border-l-2 pl-3">My Orders</h1>
        </div>
        <div id="user-info" class="text-sm font-semibold text-gray-600"></div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-6">
        <div id="loading" class="text-center py-10 font-medium text-gray-500">
            <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-pink-600 block"></i> Loading orders...
        </div>

        <div id="no-orders" class="hidden text-center py-16 bg-white rounded-xl shadow-sm border border-gray-100">
            <i class="fa-solid fa-box-open text-5xl text-gray-300 mb-3"></i>
            <p class="text-lg font-semibold text-gray-600">No past orders found.</p>
            <a href="index.html" class="inline-block mt-4 px-6 py-2 bg-pink-600 text-white rounded-lg hover:bg-pink-700 transition">Start Shopping</a>
        </div>

        <div id="orders-list" class="space-y-4"></div>
    </main>

    <!-- Return Modal with Photo Upload -->
    <div id="return-modal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-rotate-left text-amber-500 mr-2"></i>Return Product</h3>
                <button onclick="closeReturnModal()" class="text-gray-400 hover:text-gray-700 text-xl">&times;</button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Reason for Return *</label>
                    <textarea id="return-reason" rows="3" placeholder="e.g., Size is too small, product is damaged, etc..." class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-pink-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Upload Product Photo *</label>
                    <input type="file" id="return-photo" accept="image/*" onchange="previewReturnImage(event)" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-pink-50 file:text-pink-700 hover:file:bg-pink-100 cursor-pointer">
                    
                    <!-- Photo Preview -->
                    <div id="photo-preview-box" class="hidden mt-3 relative">
                        <img id="photo-preview" src="" alt="Preview" class="w-full h-40 object-contain rounded-lg border bg-gray-100">
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-2 border-t">
                <button onclick="closeReturnModal()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg text-sm font-semibold hover:bg-gray-300 transition">Cancel</button>
                <button id="submit-return-btn" onclick="submitReturnRequest()" class="px-5 py-2 bg-amber-500 text-white rounded-lg text-sm font-bold hover:bg-amber-600 shadow transition">
                    Submit Return
                    // Sirf tabhi button dikhe jab status 'delivered' ho aur rating pehle na di gayi ho
if (order.status === "delivered") {
  if (!order.isRated) {
    buttonsHTML += `<button onclick="openRatingModal('${order.id}', '${order.productId}')" style="background:#f59e0b; color:#fff; border:none; padding:8px 12px; border-radius:6px; font-weight:600; cursor:pointer;">★ Rate Product</button>`;
  } else {
    buttonsHTML += `<span style="color:#16a34a; font-size:13px; font-weight:600;">✓ Rated</span>`;
  }
}

                </button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YAHAN_APNI_ASLI_API_KEY_DALEIN",
            authDomain: "pinki-latest-fashion.firebaseapp.com",
            projectId: "pinki-latest-fashion",
            storageBucket: "pinki-latest-fashion.firebasestorage.app",
            messagingSenderId: "432889531515",
            appId: "1:432889531515:web:e0d4e5f9e04369051ae6de"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const loggedInRaw = sessionStorage.getItem("currentLoggedInUser");
        if (!loggedInRaw) {
            alert("Please log in first to view orders.");
            window.location.href = "account.html";
        }
        
        const currentUser = loggedInRaw ? JSON.parse(loggedInRaw) : {};
        document.getElementById("user-info").innerText = currentUser.name ? `Hello, ${currentUser.name}` : "";

        let selectedReturnDocId = null;
        let compressedBase64Image = "";

        async function loadUserOrders() {
            const ordersList = document.getElementById("orders-list");
            const loading = document.getElementById("loading");
            const noOrders = document.getElementById("no-orders");

            if (!currentUser.email) {
                loading.classList.add("hidden");
                noOrders.classList.remove("hidden");
                return;
            }

            const loggedEmail = currentUser.email.trim().toLowerCase();

            try {
                const snapshot = await db.collection("orders").get();
                loading.classList.add("hidden");

                const matchedOrders = [];

                snapshot.forEach(doc => {
                    const order = doc.data();
                    const dbEmail = (order.email || order.userEmail || "").trim().toLowerCase();
                    
                    if (dbEmail === loggedEmail) {
                        matchedOrders.push({ id: doc.id, ...order });
                    }
                });

                if (matchedOrders.length === 0) {
                    noOrders.classList.remove("hidden");
                    ordersList.innerHTML = "";
                    return;
                }

                noOrders.classList.add("hidden");
                ordersList.innerHTML = "";

                matchedOrders.forEach(order => {
                    const docId = order.id;
                    const isCancelled = order.deliveryStatus === "Cancelled" || order.deliveryStatus === "कैंसिल किया गया";
                    const isReturned = order.deliveryStatus === "Return Request Placed" || order.deliveryStatus === "रिटर्न रिक्वेस्ट दर्ज";

                    const card = document.createElement("div");
                    card.className = "bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row justify-between gap-4";

                    card.innerHTML = `
                        <div class="space-y-1">
                            <div class="flex items-center space-x-2">
                                <span class="text-xs bg-pink-100 text-pink-700 font-bold px-2 py-0.5 rounded">ID: ${order.orderId || docId}</span>
                                <span class="text-xs text-gray-500">${order.orderDate || ""}</span>
                            </div>
                            <h2 class="text-lg font-bold text-gray-800">${order.productName || "Product"}</h2>
                            <p class="text-sm text-gray-600">Size: <span class="font-medium">${order.size || "Free Size"}</span> | Qty: <span class="font-medium">${order.quantity || 1}</span></p>
                            <p class="text-sm text-gray-600">Total Amount: <span class="font-bold text-pink-600">₹${order.totalAmount}</span> (${order.paymentMethod || "COD"})</p>
                            <p class="text-sm">Delivery Status: 
                                <span class="font-semibold ${isCancelled ? 'text-red-600' : isReturned ? 'text-amber-600' : 'text-blue-600'}">
                                    ${order.deliveryStatus || "Processing"}
                                </span>
                            </p>
                        </div>

                        <div class="flex md:flex-col justify-end gap-2 shrink-0">
                            ${!isCancelled && !isReturned ? `
                                <button onclick="cancelOrder('${docId}')" class="px-4 py-2 bg-red-600 text-white font-bold rounded-lg text-sm hover:bg-red-700 shadow-sm transition">
                                    <i class="fa-solid fa-xmark mr-1"></i> Cancel Order
                                </button>
                                <button onclick="openReturnModal('${docId}')" class="px-4 py-2 bg-amber-500 text-white font-bold rounded-lg text-sm hover:bg-amber-600 shadow-sm transition">
                                    <i class="fa-solid fa-rotate-left mr-1"></i> Return Product
                                </button>
                            ` : `
                                <span class="text-sm font-bold px-3 py-1.5 rounded-lg ${isCancelled ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-800'} self-center">
                                    ${isCancelled ? "Order has been cancelled" : "Return is in progress"}
                                </span>
                            `}
                        </div>
                    `;

                    ordersList.appendChild(card);
                });

            } catch (err) {
                loading.innerText = "Error loading orders: " + err.message;
            }
        }

        async function cancelOrder(docId) {
            const reason = prompt("Enter reason for cancelling order (optional):");
            if (reason === null) return;

            try {
                await db.collection("orders").doc(docId).update({
                    deliveryStatus: "Cancelled",
                    cancelReason: reason || "Cancelled by customer",
                    cancelledAt: new Date().toLocaleString()
                });
                alert("Your order has been successfully cancelled.");
                loadUserOrders();
            } catch (err) {
                alert("Error occurred: " + err.message);
            }
        }

        function openReturnModal(docId) {
            selectedReturnDocId = docId;
            compressedBase64Image = "";
            document.getElementById("return-reason").value = "";
            document.getElementById("return-photo").value = "";
            document.getElementById("photo-preview-box").classList.add("hidden");
            document.getElementById("return-modal").classList.remove("hidden");
        }

        function closeReturnModal() {
            document.getElementById("return-modal").classList.add("hidden");
            selectedReturnDocId = null;
        }

        function previewReturnImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement("canvas");
                    const MAX_WIDTH = 600;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;

                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    compressedBase64Image = canvas.toDataURL("image/jpeg", 0.7);
                    document.getElementById("photo-preview").src = compressedBase64Image;
                    document.getElementById("photo-preview-box").classList.remove("hidden");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function submitReturnRequest() {
            const reason = document.getElementById("return-reason").value.trim();
            const submitBtn = document.getElementById("submit-return-btn");

            if (!reason) {
                alert("Please write the reason for return.");
                return;
            }
            if (!compressedBase64Image) {
                alert("Please upload a photo of the product.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            try {
                await db.collection("orders").doc(selectedReturnDocId).update({
                    deliveryStatus: "Return Request Placed",
                    returnReason: reason,
                    returnImage: compressedBase64Image,
                    returnedAt: new Date().toLocaleString()
                });
                
                alert("Your return request and photo have been successfully registered.");
                closeReturnModal();
                loadUserOrders();
            } catch (err) {
                alert("Problem occurred: " + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Return";
            }
        }

        loadUserOrders();
    </script>
    <!-- Rate Product Pop-up Modal -->
<div id="ratingModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:9999;">
  <div style="background:#fff; padding:20px; border-radius:14px; width:90%; max-width:380px; box-shadow:0 4px 20px rgba(0,0,0,0.15);">
    <h3 style="margin-top:0; font-size:18px;">★ Rate This Outfit</h3>
    
    <!-- Star Selector -->
    <div style="font-size:28px; margin:10px 0; cursor:pointer;">
      <span class="star-btn" onclick="selectStar(1)" style="color:#f59e0b;">★</span>
      <span class="star-btn" onclick="selectStar(2)" style="color:#f59e0b;">★</span>
      <span class="star-btn" onclick="selectStar(3)" style="color:#f59e0b;">★</span>
      <span class="star-btn" onclick="selectStar(4)" style="color:#f59e0b;">★</span>
      <span class="star-btn" onclick="selectStar(5)" style="color:#f59e0b;">★</span>
    </div>

    <textarea id="reviewComment" rows="3" placeholder="Share your experience (fabric, fitting, quality)..." style="width:100%; padding:8px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box;"></textarea>

    <label style="display:block; margin-top:10px; font-size:13px; font-weight:600;">Upload Photos (Max 3):</label>
    <input type="file" id="reviewPhotosInput" accept="image/*" multiple onchange="previewReviewPhotos(event)" style="margin-top:4px; font-size:12px;">
    <div id="reviewPhotoPreview" style="display:flex; gap:8px; margin-top:8px;"></div>

    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:16px;">
      <button onclick="closeRatingModal()" style="padding:8px 14px; border:none; background:#eee; border-radius:8px; cursor:pointer;">Cancel</button>
      <button id="submitReviewBtn" onclick="submitReview()" style="padding:8px 16px; border:none; background:#e11d48; color:#fff; border-radius:8px; font-weight:600; cursor:pointer;">Submit Review</button>
    </div>
  </div>
</div>

<script src="reviews.js"></script>
</body>
</html>
