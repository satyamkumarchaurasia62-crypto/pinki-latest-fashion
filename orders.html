<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Pinki Latest Fashion</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @keyframes popScale {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-[#fcfaf9] text-stone-800 min-h-screen">

    <header class="bg-white shadow-sm border-b border-stone-200 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="text-pink-600 hover:text-pink-700 font-bold text-lg">
                <i class="fa-solid fa-arrow-left mr-2"></i>Home
            </a>
            <h1 class="text-lg font-bold text-stone-800 border-l-2 border-stone-200 pl-3">My Orders</h1>
        </div>
        <div id="user-info" class="text-sm font-semibold text-stone-600"></div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-6">
        <div id="loading" class="text-center py-10 font-medium text-stone-500">
            <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-pink-600 block"></i> Loading orders...
        </div>

        <div id="no-orders" class="hidden text-center py-16 bg-white rounded-2xl shadow-sm border border-stone-200">
            <i class="fa-solid fa-box-open text-5xl text-stone-300 mb-3"></i>
            <p class="text-lg font-semibold text-stone-600">No past orders found.</p>
            <a href="index.html" class="inline-block mt-4 px-6 py-2.5 bg-pink-600 text-white font-semibold rounded-xl hover:bg-pink-700 transition">Start Shopping</a>
        </div>

        <div id="orders-list" class="space-y-4"></div>
    </main>

    <!-- Return Modal with Photo Upload -->
    <div id="return-modal" class="hidden fixed inset-0 bg-black/55 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-stone-800"><i class="fa-solid fa-rotate-left text-amber-500 mr-2"></i>Return Product</h3>
                <button onclick="closeReturnModal()" class="text-stone-400 hover:text-stone-700 text-2xl leading-none">&times;</button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-semibold text-stone-700 mb-1">Reason for Return *</label>
                    <textarea id="return-reason" rows="3" placeholder="e.g., Size is too small, product is damaged, etc..." class="w-full border border-stone-300 rounded-xl p-2.5 text-sm focus:outline-none focus:border-pink-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-stone-700 mb-1">Upload Product Photo *</label>
                    <input type="file" id="return-photo" accept="image/*" onchange="previewReturnImage(event)" class="w-full text-sm text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-pink-50 file:text-pink-700 hover:file:bg-pink-100 cursor-pointer">
                    
                    <!-- Photo Preview -->
                    <div id="photo-preview-box" class="hidden mt-3 relative">
                        <img id="photo-preview" src="" alt="Preview" class="w-full h-40 object-contain rounded-xl border bg-stone-100">
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-2 border-t">
                <button onclick="closeReturnModal()" class="px-4 py-2 bg-stone-200 text-stone-800 rounded-xl text-sm font-semibold hover:bg-stone-300 transition">Cancel</button>
                <button id="submit-return-btn" onclick="submitReturnRequest()" class="px-5 py-2 bg-amber-500 text-white rounded-xl text-sm font-bold hover:bg-amber-600 shadow transition">
                    Submit Return
                </button>
            </div>
        </div>
    </div>

    <!-- Rate Product Pop-up Modal -->
    <div id="ratingModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); backdrop-filter:blur(3px); justify-content:center; align-items:center; z-index:9999; padding:16px;">
        <div style="background:#fff; padding:24px; border-radius:20px; width:100%; max-width:380px; box-shadow:0 20px 35px rgba(0,0,0,0.18);">
            <h3 style="margin-top:0; font-size:18px; font-weight:700; color:#1c1917;">★ Rate This Outfit</h3>
            
            <!-- Star Selector -->
            <div style="font-size:30px; margin:10px 0; cursor:pointer; user-select:none;">
                <span class="star-btn" onclick="selectStar(1)" style="color:#f59e0b;">★</span>
                <span class="star-btn" onclick="selectStar(2)" style="color:#f59e0b;">★</span>
                <span class="star-btn" onclick="selectStar(3)" style="color:#f59e0b;">★</span>
                <span class="star-btn" onclick="selectStar(4)" style="color:#f59e0b;">★</span>
                <span class="star-btn" onclick="selectStar(5)" style="color:#f59e0b;">★</span>
            </div>

            <textarea id="reviewComment" rows="3" placeholder="Share your experience (fabric, fitting, quality)..." style="width:100%; padding:10px; border:1px solid #d6d3d1; border-radius:12px; box-sizing:border-box; font-size:14px;"></textarea>

            <label style="display:block; margin-top:12px; font-size:13px; font-weight:600; color:#44403c;">Upload Photos (Max 3, Optional):</label>
            <input type="file" id="reviewPhotosInput" accept="image/*" multiple onchange="previewReviewPhotos(event)" style="margin-top:4px; font-size:12px;">
            <div id="reviewPhotoPreview" style="display:flex; gap:8px; margin-top:8px;"></div>

            <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:18px;">
                <button onclick="closeRatingModal()" style="padding:10px 16px; border:none; background:#f5f5f4; color:#44403c; border-radius:12px; font-weight:600; cursor:pointer;">Cancel</button>
                <button id="submitReviewBtn" onclick="submitReview()" style="padding:10px 18px; border:none; background:#db2777; color:#fff; border-radius:12px; font-weight:600; cursor:pointer;">Submit Review</button>
            </div>
        </div>
    </div>

    <!-- Custom Smooth White Alert & Prompt Modal -->
    <div id="customPopupOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); backdrop-filter:blur(3px); z-index:99999; justify-content:center; align-items:center; padding:16px;">
        <div style="background:#ffffff; border-radius:20px; width:100%; max-width:360px; padding:24px; box-shadow:0 20px 35px rgba(0,0,0,0.18); text-align:center; animation:popScale 0.2s ease-out;">
            
            <div id="customPopupIcon" style="width:48px; height:48px; margin:0 auto 14px; border-radius:50%; background:#fce7f3; color:#db2777; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:bold;">
                !
            </div>

            <h3 id="customPopupTitle" style="margin:0 0 8px; font-size:18px; font-weight:700; color:#1c1917;">Notice</h3>
            <p id="customPopupMessage" style="margin:0 0 16px; font-size:14px; color:#57534e; line-height:1.5; white-space:pre-line;"></p>

            <!-- Optional Input for Cancel Reason -->
            <input type="text" id="customPopupInput" placeholder="Write reason here..." style="display:none; width:100%; padding:10px 12px; margin-bottom:16px; border:1px solid #d6d3d1; border-radius:10px; font-size:14px; box-sizing:border-box;">

            <div style="display:flex; gap:10px; justify-content:center;">
                <button id="customPopupCancelBtn" style="display:none; flex:1; padding:10px 16px; border:1px solid #d6d3d1; background:#f5f5f4; color:#44403c; border-radius:12px; font-size:14px; font-weight:600; cursor:pointer;">Close</button>
                <button id="customPopupOkBtn" style="flex:1; padding:10px 16px; border:none; background:#db2777; color:#ffffff; border-radius:12px; font-size:14px; font-weight:600; cursor:pointer; box-shadow:0 4px 12px rgba(219,39,119,0.25);">OK</button>
            </div>

        </div>
    </div>

    <script>
        // Custom Alert Function
        window.showAlert = function(message, title = "Pinki Latest Fashion", type = "info") {
            return new Promise((resolve) => {
                const overlay = document.getElementById("customPopupOverlay");
                const icon = document.getElementById("customPopupIcon");
                document.getElementById("customPopupTitle").innerText = title;
                document.getElementById("customPopupMessage").innerText = message;
                document.getElementById("customPopupInput").style.display = "none";
                
                if (type === "error") {
                    icon.style.background = "#fee2e2"; icon.style.color = "#dc2626"; icon.innerText = "✕";
                } else if (type === "success") {
                    icon.style.background = "#dcfce7"; icon.style.color = "#16a34a"; icon.innerText = "✓";
                } else {
                    icon.style.background = "#fce7f3"; icon.style.color = "#db2777"; icon.innerText = "!";
                }

                document.getElementById("customPopupCancelBtn").style.display = "none";
                const okBtn = document.getElementById("customPopupOkBtn");
                okBtn.innerText = "OK";
                overlay.style.display = "flex";

                okBtn.onclick = () => {
                    overlay.style.display = "none";
                    resolve(true);
                };
            });
        };

        // Custom Prompt Function (for Cancel Reason)
        window.showPrompt = function(message, title = "Cancel Order") {
            return new Promise((resolve) => {
                const overlay = document.getElementById("customPopupOverlay");
                const icon = document.getElementById("customPopupIcon");
                const input = document.getElementById("customPopupInput");
                
                document.getElementById("customPopupTitle").innerText = title;
                document.getElementById("customPopupMessage").innerText = message;
                icon.style.background = "#fee2e2"; icon.style.color = "#dc2626"; icon.innerText = "!";
                
                input.value = "";
                input.style.display = "block";

                const cancelBtn = document.getElementById("customPopupCancelBtn");
                const okBtn = document.getElementById("customPopupOkBtn");
                cancelBtn.style.display = "block";
                okBtn.innerText = "Confirm Cancel";
                overlay.style.display = "flex";

                cancelBtn.onclick = () => {
                    overlay.style.display = "none";
                    resolve(null);
                };
                okBtn.onclick = () => {
                    overlay.style.display = "none";
                    resolve(input.value.trim());
                };
            });
        };

        const firebaseConfig = {
            apiKey: "AIzaSyDSLRGEEt8Ig20xLUcPR3YLohGnsDohZLM",
            authDomain: "pinki-latest-fashion.firebaseapp.com",
            projectId: "pinki-latest-fashion",
            storageBucket: "pinki-latest-fashion.firebasestorage.app",
            messagingSenderId: "432889531515",
            appId: "1:432889531515:web:e0d4e5f9e84369051ae6de"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const loggedInRaw = sessionStorage.getItem("currentLoggedInUser");
        if (!loggedInRaw) {
            window.location.href = "account.html";
        }
        
        const currentUser = loggedInRaw ? JSON.parse(loggedInRaw) : {};
        document.getElementById("user-info").innerText = currentUser.name ? `Hello, ${currentUser.name}` : "";

        let selectedReturnDocId = null;
        let compressedBase64Image = "";

        async function loadUserOrders() {
            const ordersList = document.getElementById("orders-list");
            const loading = document.getElementById("loading");
            const noOrders = document.getElementById("no-orders");

            if (!currentUser.email) {
                loading.classList.add("hidden");
                noOrders.classList.remove("hidden");
                return;
            }

            const loggedEmail = currentUser.email.trim().toLowerCase();

            try {
                const snapshot = await db.collection("orders").get();
                loading.classList.add("hidden");

                const matchedOrders = [];

                snapshot.forEach(doc => {
                    const order = doc.data();
                    const dbEmail = (order.email || order.userEmail || "").trim().toLowerCase();
                    
                    if (dbEmail === loggedEmail) {
                        matchedOrders.push({ id: doc.id, ...order });
                    }
                });

                if (matchedOrders.length === 0) {
                    noOrders.classList.remove("hidden");
                    ordersList.innerHTML = "";
                    return;
                }

                noOrders.classList.add("hidden");
                ordersList.innerHTML = "";

                matchedOrders.forEach(order => {
                    const docId = order.id;
                    const statusRaw = (order.deliveryStatus || order.status || "packing").toLowerCase();
                    const isCancelled = statusRaw === "cancelled" || order.deliveryStatus === "कैंसिल किया गया";
                    const isReturned = statusRaw === "return request placed" || order.deliveryStatus === "रिटर्न रिक्वेस्ट दर्ज";
                    const isDelivered = statusRaw === "delivered";

                    let actionButtonsHTML = "";

                    if (isCancelled) {
                        actionButtonsHTML = `<span class="text-sm font-bold px-3 py-1.5 rounded-xl bg-red-100 text-red-700 self-center">Order Cancelled</span>`;
                    } else if (isReturned) {
                        actionButtonsHTML = `<span class="text-sm font-bold px-3 py-1.5 rounded-xl bg-amber-100 text-amber-800 self-center">Return in Progress</span>`;
                    } else if (isDelivered) {
                        // Delivered hone ke baad Rate aur Return buttons dikhenge
                        if (!order.isRated) {
                            actionButtonsHTML += `
                                <button onclick="openRatingModal('${docId}', '${order.productId}')" class="px-4 py-2 bg-pink-600 text-white font-bold rounded-xl text-sm hover:bg-pink-700 shadow-sm transition">
                                    ★ Rate Product
                                </button>`;
                        } else {
                            actionButtonsHTML += `<span class="text-sm font-bold px-3 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 text-center">✓ Rated</span>`;
                        }
                        actionButtonsHTML += `
                            <button onclick="openReturnModal('${docId}')" class="px-4 py-2 bg-amber-500 text-white font-bold rounded-xl text-sm hover:bg-amber-600 shadow-sm transition">
                                <i class="fa-solid fa-rotate-left mr-1"></i> Return Product
                            </button>`;
                    } else {
                        // Packing ya Shipped hone par sirf Cancel Order button dikhega
                        actionButtonsHTML = `
                            <button onclick="cancelOrder('${docId}')" class="px-4 py-2 bg-red-600 text-white font-bold rounded-xl text-sm hover:bg-red-700 shadow-sm transition">
                                <i class="fa-solid fa-xmark mr-1"></i> Cancel Order
                            </button>`;
                    }

                    const card = document.createElement("div");
                    card.className = "bg-white p-5 rounded-2xl shadow-sm border border-stone-200 flex flex-col md:flex-row justify-between gap-4";

                    card.innerHTML = `
                        <div class="space-y-1">
                            <div class="flex items-center space-x-2">
                                <span class="text-xs bg-pink-100 text-pink-700 font-bold px-2.5 py-0.5 rounded-full">ID: ${order.orderId || docId}</span>
                                <span class="text-xs text-stone-500">${order.orderDate || ""}</span>
                            </div>
                            <h2 class="text-lg font-bold text-stone-800">${order.productName || "Product"}</h2>
                            <p class="text-sm text-stone-600">Size: <span class="font-medium">${order.size || "Free Size"}</span> | Qty: <span class="font-medium">${order.quantity || 1}</span></p>
                            <p class="text-sm text-stone-600">Total Amount: <span class="font-bold text-pink-600">₹${order.totalAmount}</span> (${order.paymentMethod || "COD"})</p>
                            <p class="text-sm">Delivery Status: 
                                <span class="font-semibold capitalize ${isCancelled ? 'text-red-600' : isReturned ? 'text-amber-600' : isDelivered ? 'text-emerald-600' : 'text-blue-600'}">
                                    ${order.deliveryStatus || "Processing"}
                                </span>
                            </p>
                        </div>

                        <div class="flex md:flex-col justify-end gap-2 shrink-0">
                            ${actionButtonsHTML}
                        </div>
                    `;

                    ordersList.appendChild(card);
                });

            } catch (err) {
                loading.innerText = "Error loading orders: " + err.message;
            }
        }

        async function cancelOrder(docId) {
            const reason = await showPrompt("Enter reason for cancelling order (optional):", "Cancel Order");
            if (reason === null) return;

            try {
                await db.collection("orders").doc(docId).update({
                    deliveryStatus: "Cancelled",
                    cancelReason: reason || "Cancelled by customer",
                    cancelledAt: new Date().toLocaleString()
                });
                await showAlert("Your order has been successfully cancelled.", "Order Cancelled", "success");
                loadUserOrders();
            } catch (err) {
                await showAlert("Error occurred: " + err.message, "Error", "error");
            }
        }

        function openReturnModal(docId) {
            selectedReturnDocId = docId;
            compressedBase64Image = "";
            document.getElementById("return-reason").value = "";
            document.getElementById("return-photo").value = "";
            document.getElementById("photo-preview-box").classList.add("hidden");
            document.getElementById("return-modal").classList.remove("hidden");
        }

        function closeReturnModal() {
            document.getElementById("return-modal").classList.add("hidden");
            selectedReturnDocId = null;
        }

        function previewReturnImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement("canvas");
                    const MAX_WIDTH = 600;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;

                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    compressedBase64Image = canvas.toDataURL("image/jpeg", 0.7);
                    document.getElementById("photo-preview").src = compressedBase64Image;
                    document.getElementById("photo-preview-box").classList.remove("hidden");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function submitReturnRequest() {
            const reason = document.getElementById("return-reason").value.trim();
            const submitBtn = document.getElementById("submit-return-btn");

            if (!reason) {
                await showAlert("Please write the reason for return.", "Reason Required", "error");
                return;
            }
            if (!compressedBase64Image) {
                await showAlert("Please upload a photo of the product.", "Photo Required", "error");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            try {
                await db.collection("orders").doc(selectedReturnDocId).update({
                    deliveryStatus: "Return Request Placed",
                    returnReason: reason,
                    returnImage: compressedBase64Image,
                    returnedAt: new Date().toLocaleString()
                });
                
                await showAlert("Your return request and photo have been successfully registered.", "Return Submitted", "success");
                closeReturnModal();
                loadUserOrders();
            } catch (err) {
                await showAlert("Problem occurred: " + err.message, "Error", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Return";
            }
        }

        loadUserOrders();
    </script>

    <script src="review.js"></script>
</body>
</html>
