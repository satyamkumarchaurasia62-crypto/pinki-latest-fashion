<script>
    // स्क्रीन बदलने का फंक्शन
    function showBox(type) {
      document.getElementById("login-box").style.display = type === 'login' ? 'block' : 'none';
      document.getElementById("signup-box").style.display = type === 'signup' ? 'block' : 'none';
      document.getElementById("forgot-box").style.display = type === 'forgot' ? 'block' : 'none';
      document.getElementById("profile-box").style.display = type === 'profile' ? 'block' : 'none';
    }

    function getUsers() {
      const users = localStorage.getItem("registeredUsers");
      return users ? JSON.parse(users) : {};
    }

    document.addEventListener("DOMContentLoaded", function() {
      const currentLoggedIn = localStorage.getItem("currentLoggedInUser");
      if (currentLoggedIn) {
        loadProfile(JSON.parse(currentLoggedIn));
      } else {
        showBox('login');
      }
    });

    function loadProfile(user) {
      showBox('profile');
      document.getElementById("user-display-name").innerText = user.name;
      document.getElementById("user-display-email").innerText = user.email;
    }

    // लॉगआउट फंक्शन
    function logout() {
      localStorage.removeItem("currentLoggedInUser");
      alert("आप सफलतापूर्वक लॉगआउट हो चुके हैं।");
      showBox('login');
    }

    // एक्शन 1: नया अकाउंट बनाना (Sign Up)
    document.getElementById("signup-form").addEventListener("submit", function(e) {
      e.preventDefault();
      
      const name = document.getElementById("signup-name").value;
      const email = document.getElementById("signup-email").value.trim().toLowerCase();
      const password = document.getElementById("signup-password").value;
      const question = document.getElementById("signup-question").value;
      const answer = document.getElementById("signup-answer").value.trim().toLowerCase();

      const users = getUsers();

      if (users[email]) {
        alert("यह ईमेल एड्रेस पहले से ही रजिस्टर्ड है!");
        return;
      }

      users[email] = { name, email, password, question, answer };
      localStorage.setItem("registeredUsers", JSON.stringify(users));
      
      alert("अकाउंट सफलतापूर्वक बन गया है! अब आप लॉगिन कर सकते हैं।");
      document.getElementById("signup-form").reset();
      showBox('login');
    });

    // एक्शन 2: लॉग इन करना (Sign In)
    document.getElementById("login-form").addEventListener("submit", function(e) {
      e.preventDefault();

      const email = document.getElementById("login-email").value.trim().toLowerCase();
      const password = document.getElementById("login-password").value;

      const users = getUsers();
      const user = users[email];

      if (user && user.password === password) {
        const sessionUser = { name: user.name, email: user.email };
        localStorage.setItem("currentLoggedInUser", JSON.stringify(sessionUser));
        loadProfile(sessionUser);
        document.getElementById("login-form").reset();
      } else {
        alert("गलत ईमेल या पासवर्ड! कृपया दोबारा जाँचें।");
      }
    });

    // एक्शन 3: पासवर्ड रिकवरी (Reset Password)
    document.getElementById("forgot-form").addEventListener("submit", function(e) {
      e.preventDefault();

      const email = document.getElementById("forgot-email").value.trim().toLowerCase();
      const question = document.getElementById("forgot-question").value;
      const answer = document.getElementById("forgot-answer").value.trim().toLowerCase();
      const newPassword = document.getElementById("forgot-new-password").value;

      const users = getUsers();
      const user = users[email];

      if (!user) {
        alert("यह ईमेल एड्रेस सिस्टम में नहीं मिला!");
        return;
      }

      if (user.question === question && user.answer === answer) {
        user.password = newPassword;
        users[email] = user;
        localStorage.setItem("registeredUsers", JSON.stringify(users));
        alert("पासवर्ड सफलतापूर्वक बदल गया है! अब नए पासवर्ड से लॉगिन करें।");
        document.getElementById("forgot-form").reset();
        showBox('login');
      } else {
        alert("सुरक्षा सवाल या जवाब मेल नहीं खा रहा है!");
      }
    });
  </script>
</body>
</html>
