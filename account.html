<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Pinki Latest Fashion</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @keyframes popScale {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-[#fcfaf9] text-stone-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-stone-200 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="text-pink-600 hover:text-pink-700 font-bold text-lg">
                <i class="fa-solid fa-arrow-left mr-2"></i>Home
            </a>
            <h1 class="text-lg font-bold text-stone-800 border-l-2 border-stone-200 pl-3">Customer Account</h1>
        </div>
        <button onclick="logoutUser()" class="px-4 py-1.5 bg-red-100 text-red-700 text-xs font-bold rounded-xl hover:bg-red-200 transition">
            <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
        </button>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto p-4 md:p-6 flex-grow w-full space-y-6">
        
        <!-- Not Logged In View -->
        <div id="auth-container" class="bg-white rounded-2xl p-6 shadow-sm border border-stone-200 space-y-4">
            <div class="text-center space-y-1">
                <h2 id="auth-title" class="text-xl font-bold text-stone-900">Login to Your Account</h2>
                <p class="text-xs text-stone-500">Track orders, manage profile and update delivery addresses</p>
            </div>

            <div id="register-fields" class="hidden space-y-3">
                <div>
                    <label class="block text-xs font-bold text-stone-700 mb-1">Full Name *</label>
                    <input type="text" id="reg-name" placeholder="Enter your full name" class="w-full border border-stone-300 rounded-xl px-3 py-2.5 text-xs outline-none focus:border-pink-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-700 mb-1">Phone Number *</label>
                    <input type="tel" id="reg-phone" maxlength="10" placeholder="10-digit mobile number" class="w-full border border-stone-300 rounded-xl px-3 py-2.5 text-xs outline-none focus:border-pink-600">
                </div>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-stone-700 mb-1">Email Address *</label>
                    <input type="email" id="auth-email" placeholder="your.email@gmail.com" class="w-full border border-stone-300 rounded-xl px-3 py-2.5 text-xs outline-none focus:border-pink-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-stone-700 mb-1">Password *</label>
                    <input type="password" id="auth-pass" placeholder="Enter password" class="w-full border border-stone-300 rounded-xl px-3 py-2.5 text-xs outline-none focus:border-pink-600">
                </div>
            </div>

            <div id="register-address-fields" class="hidden space-y-3 pt-2 border-t">
                <div class="text-xs font-bold text-stone-800">Default Delivery Address</div>
                <div>
                    <label class="block text-xs font-semibold text-stone-600 mb-1">Street Address / House No. *</label>
                    <input type="text" id="reg-address" placeholder="House/Flat No., Street, Landmark" class="w-full border border-stone-300 rounded-xl px-3 py-2 text-xs outline-none focus:border-pink-600">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-stone-600 mb-1">City *</label>
                        <input type="text" id="reg-city" placeholder="City Name" class="w-full border border-stone-300 rounded-xl px-3 py-2 text-xs outline-none focus:border-pink-600">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-600 mb-1">Pincode *</label>
                        <input type="text" id="reg-pincode" maxlength="6" placeholder="6-digit Pincode" class="w-full border border-stone-300 rounded-xl px-3 py-2 text-xs outline-none focus:border-pink-600">
                    </div>
                </div>
            </div>

            <button id="auth-submit-btn" onclick="handleAuthSubmit()" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl text-xs transition shadow">
                Login
            </button>

            <div class="text-center pt-2">
                <button type="button" onclick="toggleAuthMode()" id="auth-toggle-text" class="text-xs font-semibold text-pink-600 hover:underline">
                    Don't have an account? Register here
                </button>
            </div>
        </div>

        <!-- Logged In Profile & Update Form -->
        <div id="profile-container" class="hidden space-y-4">
            
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-stone-200 flex items-center justify-between">
                <div>
                    <h2 class="text-lg font-bold text-stone-900" id="profile-display-name">User Name</h2>
                    <p class="text-xs text-stone-500" id="profile-display-email">email@domain.com</p>
                </div>
                <a href="orders.html" class="px-4 py-2 bg-pink-50 text-pink-700 font-bold rounded-xl text-xs hover:bg-pink-100 transition border border-pink-200">
                    <i class="fa-solid fa-box mr-1"></i> My Orders
                </a>
            </div>

            <!-- Profile & Address Update Form -->
            <div class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-stone-200 space-y-4">
                <div class="border-b pb-3 flex justify-between items-center">
                    <h3 class="text-sm font-bold text-stone-800"><i class="fa-solid fa-user-pen mr-1.5 text-pink-600"></i> Edit Profile & Delivery Address</h3>
                    <span class="text-[11px] text-amber-700 bg-amber-50 px-2.5 py-0.5 rounded-full font-semibold border border-amber-200">Name Change: <span id="name-change-status">Allowed (1 Time)</span></span>
                </div>

                <div class="space-y-3 text-xs">
                    <div>
                        <label class="block font-bold text-stone-700 mb-1">Full Name <span id="name-lock-hint" class="text-[10px] text-stone-400 font-normal">(Can be changed only once)</span></label>
                        <input type="text" id="update-name" class="w-full border border-stone-300 rounded-xl px-3 py-2.5 bg-white font-semibold focus:border-pink-600 outline-none">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block font-bold text-stone-700 mb-1">Phone Number *</label>
                            <input type="tel" id="update-phone" maxlength="10" class="w-full border border-stone-300 rounded-xl px-3 py-2.5 bg-white focus:border-pink-600 outline-none">
                        </div>
                        <div>
                            <label class="block font-bold text-stone-700 mb-1">Email Address (Locked)</label>
                            <input type="email" id="update-email" readonly class="w-full border border-stone-200 rounded-xl px-3 py-2.5 bg-stone-100 text-stone-500 cursor-not-allowed">
                        </div>
                    </div>

                    <div class="pt-2 border-t space-y-3">
                        <div class="font-bold text-stone-800">Saved Delivery Address</div>
                        <div>
                            <label class="block font-semibold text-stone-600 mb-1">Street Address / House No. *</label>
                            <input type="text" id="update-address" class="w-full border border-stone-300 rounded-xl px-3 py-2 bg-white outline-none focus:border-pink-600">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block font-semibold text-stone-600 mb-1">City *</label>
                                <input type="text" id="update-city" class="w-full border border-stone-300 rounded-xl px-3 py-2 bg-white outline-none focus:border-pink-600">
                            </div>
                            <div>
                                <label class="block font-semibold text-stone-600 mb-1">Pincode *</label>
                                <input type="text" id="update-pincode" maxlength="6" class="w-full border border-stone-300 rounded-xl px-3 py-2 bg-white outline-none focus:border-pink-600">
                            </div>
                        </div>
                    </div>
                </div>

                <button onclick="updateUserProfile()" class="w-full sm:w-auto px-6 py-2.5 bg-stone-900 hover:bg-stone-800 text-white font-bold rounded-xl text-xs transition shadow">
                    Save Changes
                </button>
            </div>

        </div>
    </main>

    <!-- Custom Smooth White Alert Modal -->
    <div id="customPopupOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); backdrop-filter:blur(3px); z-index:99999; justify-content:center; align-items:center; padding:16px;">
        <div style="background:#ffffff; border-radius:20px; width:100%; max-width:360px; padding:24px; box-shadow:0 20px 35px rgba(0,0,0,0.18); text-align:center; animation:popScale 0.2s ease-out;">
            <div id="customPopupIcon" style="width:48px; height:48px; margin:0 auto 14px; border-radius:50%; background:#fce7f3; color:#db2777; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:bold;">!</div>
            <h3 id="customPopupTitle" style="margin:0 0 8px; font-size:18px; font-weight:700; color:#1c1917;">Notice</h3>
            <p id="customPopupMessage" style="margin:0 0 16px; font-size:14px; color:#57534e; line-height:1.5; white-space:pre-line;"></p>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button id="customPopupOkBtn" style="flex:1; padding:10px 16px; border:none; background:#db2777; color:#ffffff; border-radius:12px; font-size:14px; font-weight:600; cursor:pointer; box-shadow:0 4px 12px rgba(219,39,119,0.25);">OK</button>
            </div>
        </div>
    </div>

    <script>
        window.showAlert = function(message, title = "Pinki Latest Fashion", type = "info") {
            return new Promise((resolve) => {
                const overlay = document.getElementById("customPopupOverlay");
                const icon = document.getElementById("customPopupIcon");
                document.getElementById("customPopupTitle").innerText = title;
                document.getElementById("customPopupMessage").innerText = message;
                
                if (type === "error") {
                    icon.style.background = "#fee2e2"; icon.style.color = "#dc2626"; icon.innerText = "✕";
                } else if (type === "success") {
                    icon.style.background = "#dcfce7"; icon.style.color = "#16a34a"; icon.innerText = "✓";
                } else {
                    icon.style.background = "#fce7f3"; icon.style.color = "#db2777"; icon.innerText = "!";
                }

                const okBtn = document.getElementById("customPopupOkBtn");
                okBtn.innerText = "OK";
                overlay.style.display = "flex";

                okBtn.onclick = () => {
                    overlay.style.display = "none";
                    resolve(true);
                };
            });
        };

        const firebaseConfig = {
            apiKey: "AIzaSyDSLRGEEt8Ig2oXLUcPR3YLohGnSDohZLw",
            authDomain: "pinki-latest-fashion.firebaseapp.com",
            projectId: "pinki-latest-fashion",
            storageBucket: "pinki-latest-fashion.firebasestorage.app",
            messagingSenderId: "432889531515",
            appId: "1:432889531515:web:00d4e5f9e84369051ae6de",
            measurementId: "G-CXSRMW6GVY"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let isRegisterMode = false;
        let currentUserDocId = null;

        window.addEventListener("DOMContentLoaded", () => {
            const loggedRaw = sessionStorage.getItem("currentLoggedInUser");
            if (loggedRaw) {
                const user = JSON.parse(loggedRaw);
                showProfileDashboard(user);
            }
        });

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById("auth-title");
            const btn = document.getElementById("auth-submit-btn");
            const toggleText = document.getElementById("auth-toggle-text");
            const regFields = document.getElementById("register-fields");
            const regAddress = document.getElementById("register-address-fields");

            if (isRegisterMode) {
                title.innerText = "Create New Account";
                btn.innerText = "Register & Login";
                toggleText.innerText = "Already have an account? Login here";
                regFields.classList.remove("hidden");
                regAddress.classList.remove("hidden");
            } else {
                title.innerText = "Login to Your Account";
                btn.innerText = "Login";
                toggleText.innerText = "Don't have an account? Register here";
                regFields.classList.add("hidden");
                regAddress.classList.add("hidden");
            }
        }

        async function handleAuthSubmit() {
            const email = document.getElementById("auth-email").value.trim().toLowerCase();
            const pass = document.getElementById("auth-pass").value.trim();

            if (!email || !pass) {
                await showAlert("Please enter both email and password.", "Required", "error");
                return;
            }

            try {
                const usersRef = db.collection("users");
                const snapshot = await usersRef.where("email", "==", email).get();

                if (isRegisterMode) {
                    const name = document.getElementById("reg-name").value.trim();
                    const phone = document.getElementById("reg-phone").value.trim();
                    const address = document.getElementById("reg-address").value.trim();
                    const city = document.getElementById("reg-city").value.trim();
                    const pincode = document.getElementById("reg-pincode").value.trim();

                    if (!name || !phone || !address || !city || !pincode) {
                        await showAlert("Please fill in all registration details including address.", "Missing Fields", "error");
                        return;
                    }

                    if (!snapshot.empty) {
                        await showAlert("This email is already registered. Please login.", "Email Exists", "error");
                        return;
                    }

                    const newUser = {
                        name,
                        email,
                        pass,
                        phone,
                        address,
                        city,
                        pincode,
                        nameChangedCount: 0,
                        createdAt: new Date().toISOString()
                    };

                    const docRef = await usersRef.add(newUser);
                    newUser.docId = docRef.id;
                    sessionStorage.setItem("currentLoggedInUser", JSON.stringify(newUser));
                    
                    await showAlert("Account created successfully!", "Success", "success");
                    window.location.href = "index.html"; // 👈 OK दबाते ही सीधे होम फीड पर रीडायरेक्ट हो जाएगा

                } else {
                    if (snapshot.empty) {
                        await showAlert("No account found with this email. Please register first.", "Not Found", "error");
                        return;
                    }

                    let userData = null;
                    snapshot.forEach(doc => {
                        userData = { docId: doc.id, ...doc.data() };
                    });

                    if (userData.pass !== pass) {
                        await showAlert("Incorrect password. Please try again.", "Invalid Password", "error");
                        return;
                    }

                    sessionStorage.setItem("currentLoggedInUser", JSON.stringify(userData));
                    
                    await showAlert("Logged in successfully!", "Welcome", "success");
                    window.location.href = "index.html"; // 👈 OK दबाते ही सीधे होम फीड पर रीडायरेक्ट हो जाएगा
                }
            } catch (err) {
                await showAlert("Error: " + err.message, "Failed", "error");
            }
        }

        function showProfileDashboard(user) {
            currentUserDocId = user.docId;
            document.getElementById("auth-container").classList.add("hidden");
            document.getElementById("profile-container").classList.remove("hidden");

            document.getElementById("profile-display-name").innerText = user.name || "Customer";
            document.getElementById("profile-display-email").innerText = user.email || "";

            document.getElementById("update-name").value = user.name || "";
            document.getElementById("update-phone").value = user.phone || "";
            document.getElementById("update-email").value = user.email || "";
            document.getElementById("update-address").value = user.address || "";
            document.getElementById("update-city").value = user.city || "";
            document.getElementById("update-pincode").value = user.pincode || "";

            const changeCount = user.nameChangedCount || 0;
            const nameInput = document.getElementById("update-name");
            const statusBadge = document.getElementById("name-change-status");
            const lockHint = document.getElementById("name-lock-hint");

            if (changeCount >= 1) {
                nameInput.readOnly = true;
                nameInput.classList.add("bg-stone-100", "text-stone-500", "cursor-not-allowed");
                statusBadge.innerText = "Locked (Already Changed 1 Time)";
                statusBadge.className = "text-[11px] text-red-700 bg-red-50 px-2.5 py-0.5 rounded-full font-semibold border border-red-200";
                lockHint.innerText = "(You have already used your 1 name change)";
            }
        }

        async function updateUserProfile() {
            if (!currentUserDocId) return;

            const phone = document.getElementById("update-phone").value.trim();
            const address = document.getElementById("update-address").value.trim();
            const city = document.getElementById("update-city").value.trim();
            const pincode = document.getElementById("update-pincode").value.trim();
            const nameInput = document.getElementById("update-name");

            if (!phone || !address || !city || !pincode) {
                await showAlert("Phone, address, city and pincode cannot be empty.", "Missing Fields", "error");
                return;
            }

            const rawStored = sessionStorage.getItem("currentLoggedInUser");
            let currentUserObj = rawStored ? JSON.parse(rawStored) : {};
            let nameChangedCount = currentUserObj.nameChangedCount || 0;

            const updatePayload = {
                phone,
                address,
                city,
                pincode
            };

            if (!nameInput.readOnly) {
                const newName = nameInput.value.trim();
                if (!newName) {
                    await showAlert("Name cannot be empty.", "Error", "error");
                    return;
                }
                if (newName !== currentUserObj.name) {
                    updatePayload.name = newName;
                    updatePayload.nameChangedCount = nameChangedCount + 1;
                    currentUserObj.name = newName;
                    currentUserObj.nameChangedCount = updatePayload.nameChangedCount;
                }
            }

            try {
                await db.collection("users").doc(currentUserDocId).update(updatePayload);

                currentUserObj.phone = phone;
                currentUserObj.address = address;
                currentUserObj.city = city;
                currentUserObj.pincode = pincode;

                sessionStorage.setItem("currentLoggedInUser", JSON.stringify(currentUserObj));
                showProfileDashboard(currentUserObj);

                await showAlert("Profile and address updated successfully!", "Updated", "success");
            } catch (err) {
                await showAlert("Error updating profile: " + err.message, "Failed", "error");
            }
        }

        function logoutUser() {
            sessionStorage.removeItem("currentLoggedInUser");
            location.reload();
        }
    </script>
</body>
</html>
